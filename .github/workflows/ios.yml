# Builds the iPhone and iPad download (pokemon-ds-wide-ios.ipa, tools/ios/build_all.sh), unsigned
# for sideloading, and starts a Simulator build on an iPhone and an iPad to check that it
# opens on its game list, upright
# (a screenshot and its game.log are the run's artifacts; no ROM is ever given to this workflow,
# so no game is played here). Started by the maintainer's script or by hand (Actions tab).
#
# Its inputs are the Mac download's (the draft release mac-build-inputs, .github/workflows/mac.yml):
# SoulSilver and HeartGold's tables (addresses only), the game list's pictures and the icon.
name: iOS download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cmake>=3.21,<4" ninja
      - name: The inputs (tables of addresses, pictures, icon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inputs
          gh release download mac-build-inputs -R "${{ github.repository }}" -p mac-inputs.tar.gz -D inputs
          tar -xzf inputs/mac-inputs.tar.gz -C inputs
          ls inputs
      - name: GBA games (mGBA and the widescreen patches, when the inputs include them)
        run: bash tools/apple/fetch_gba.sh inputs
      - run: tools/ios/build_all.sh inputs/build-gen-tables inputs/box-art inputs/icon.jpg
        env:
          SSR_IOS_TARGET: ${{ matrix.target }}
          SSR_IOS_ARCH: x86_64
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'device'
        with:
          name: ios-ipa
          path: build-ios-dist/pokemon-ds-wide-ios.ipa
          if-no-files-found: error
      - name: A first start in the iOS Simulator
        if: matrix.target == 'simulator'
        run: |
          set -euo pipefail
          mkdir -p sim
          # An iPhone and an iPad. The list should come up upright on both.
          start_one() {
            local kind="$1"
            local udid
            udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          kind = sys.argv[1]
          d = json.load(sys.stdin)["devices"]
          found = [x["udid"] for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith(kind)]
          if not found:
              raise SystemExit("no " + kind + " simulator")
          print(found[-1])
          ' "$kind")"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "build-ios-dist/Pokemon Fulldex.app"
            xcrun simctl launch "$udid" io.github.mamesj.pokemonds
            sleep 25
            xcrun simctl io "$udid" screenshot "sim/${kind}-first-start.png"
            local data
            data="$(xcrun simctl get_app_container "$udid" io.github.mamesj.pokemonds data)"
            ls -laR "$data/Documents" > "sim/${kind}-documents.txt" || true
            cp "$data/Documents/game.log" "sim/${kind}-game.log" || true
            xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'process == "pokemon-ds-wide"' > "sim/${kind}-system.log" || true
            cat "sim/${kind}-game.log" || true
            grep -q '\[launcher\] folder' "sim/${kind}-game.log"
            python3 -c '
          import struct, sys
          kind, path = sys.argv[1], sys.argv[2]
          w, h = struct.unpack(">II", open(path, "rb").read(24)[16:24])
          print("%s screenshot %dx%d" % (kind, w, h))
          if h <= w:
              raise SystemExit("%s list is not upright (%dx%d)" % (kind, w, h))
          ' "$kind" "sim/${kind}-first-start.png"
            xcrun simctl shutdown "$udid" || true
          }
          start_one iPhone
          start_one iPad
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'simulator'
        with:
          name: ios-simulator-first-start
          path: sim/
          if-no-files-found: warn

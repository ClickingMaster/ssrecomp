# Builds the iPhone and iPad download (pokemon-ds-wide-ios.ipa, tools/ios/build_all.sh), unsigned
# for sideloading, and starts a Simulator build on an iPhone and an iPad to check that it
# submits a launcher frame and produces a nonblank full-screen screenshot
# (a screenshot and its game.log are the run's artifacts; no ROM is ever given to this workflow,
# so no game is played here). Started by the maintainer's script or by hand (Actions tab).
#
# Its inputs are the Mac download's (the draft release mac-build-inputs, .github/workflows/mac.yml):
# SoulSilver and HeartGold's tables (addresses only), the game list's pictures and the icon.
name: iOS download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            os: xcode-27
            arch: arm64
          - target: simulator
            os: xcode-27
            arch: arm64
          # Retain coverage of older Intel simulator toolchains as well.
          - target: simulator
            os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cmake==3.31.10" ninja Pillow
      - name: Toolchain and available simulator runtimes
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      - name: Check simulator failure detection
        run: |
          python tools/ios/test_simulator_start.py
          python tools/ios/test_simulator_capture.py
      - name: The inputs (tables of addresses, pictures, icon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inputs
          gh release download mac-build-inputs -R "${{ github.repository }}" -p mac-inputs.tar.gz -D inputs
          tar -xzf inputs/mac-inputs.tar.gz -C inputs
          ls inputs
      - name: GBA games (mGBA and the widescreen patches, when the inputs include them)
        run: bash tools/apple/fetch_gba.sh inputs
      - run: tools/ios/build_all.sh inputs/build-gen-tables inputs/box-art inputs/icon.jpg
        env:
          SSR_IOS_TARGET: ${{ matrix.target }}
          SSR_IOS_ARCH: ${{ matrix.arch }}
      - name: Check SDL scene integration and cache upgrades
        run: |
          mkdir -p scene-check
          curl --fail --location --retry 3 https://www.libsdl.org/release/SDL2-2.32.10.tar.gz -o scene-check/SDL2.tar.gz
          echo '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165  scene-check/SDL2.tar.gz' | shasum -a 256 -c -
          tar -xzf scene-check/SDL2.tar.gz -C scene-check
          python tools/ios/check_scene_integration.py scene-check/SDL2-2.32.10
      - name: Archive the simulator app
        if: matrix.target == 'simulator'
        run: ditto -c -k --sequesterRsrc --keepParent "build-ios-dist/Pokemon Fulldex.app" "build-ios-dist/pokemon-fulldex-simulator-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'simulator'
        with:
          name: ios-simulator-app-${{ matrix.arch }}
          path: build-ios-dist/pokemon-fulldex-simulator-${{ matrix.arch }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'device'
        with:
          name: ios-ipa
          path: |
            build-ios-dist/pokemon-ds-wide-ios.ipa
            build-ios-dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: A first start in the iOS Simulator
        timeout-minutes: 15
        if: matrix.target == 'simulator'
        env:
          IOS_TEST_MIN_MAJOR: ${{ matrix.os == 'xcode-27' && '27' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p sim
          xcrun simctl list devices available -j > sim/available-devices.json
          # An iPhone and an iPad. The list should come up upright on both.
          start_one() (
            local kind="$1"
            local udid
            udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          kind = sys.argv[1]
          minimum = int(os.environ["IOS_TEST_MIN_MAJOR"])
          d = json.load(sys.stdin)["devices"]
          import re
          def version(runtime):
              return tuple(map(int, re.findall(r"[0-9]+", runtime.split("iOS-")[-1])))
          found = [(version(k), x) for k, v in d.items() if "iOS" in k and version(k) >= (minimum,) for x in v if x.get("isAvailable", True) and x["name"].startswith(kind)]
          if not found:
              raise SystemExit("no " + kind + " simulator")
          # Prefer Duo where installed, then the newest compatible runtime.
          _, device = max(found, key=lambda item: ("Duo" in item[1]["name"], item[0], item[1]["name"]))
          print("Testing " + device["name"], file=sys.stderr)
          print(device["udid"])
          ' "$kind")" || exit 1
            local console_pid=""
            cleanup() {
              if [ -n "$console_pid" ]; then
                # simctl --console may ignore TERM after the app redirects stderr.
                # Kill only our capture helper; never wait indefinitely for it.
                kill -KILL "$console_pid" 2>/dev/null || true
              fi
              python3 tools/ios/shutdown_simulator.py "$udid"
            }
            trap cleanup EXIT
            xcrun simctl boot "$udid" || exit 1
            xcrun simctl bootstatus "$udid" -b || exit 1
            xcrun simctl install "$udid" "build-ios-dist/Pokemon Fulldex.app" || exit 1
            local data
            data="$(xcrun simctl get_app_container "$udid" io.github.mamesj.pokemonds data)" || exit 1
            xcrun simctl launch --terminate-running-process --console "$udid" io.github.mamesj.pokemonds > "sim/${kind}-console.log" 2>&1 &
            console_pid=$!
            # Booted simulators can still be slow to launch. Wait for evidence
            # of a submitted frame, while retaining a bounded failure timeout.
            for attempt in $(seq 1 60); do
              if [ -f "$data/Documents/game.log" ] && grep -q '\[launcher\] frame presented' "$data/Documents/game.log"; then
                break
              fi
              if ! kill -0 "$console_pid" 2>/dev/null; then break; fi
              sleep 2
            done
            ls -laR "$data/Documents" > "sim/${kind}-documents.txt" || true
            cp "$data/Documents/game.log" "sim/${kind}-game.log" || true
            cat "sim/${kind}-console.log" > "sim/${kind}-combined.log"
            if [ -f "sim/${kind}-game.log" ]; then
              cat "sim/${kind}-game.log" >> "sim/${kind}-combined.log"
            else
              echo "No Documents/game.log was created; checking captured console output."
            fi
            cat "sim/${kind}-combined.log"
            xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'process == "pokemon-ds-wide"' > "sim/${kind}-system.log" || true
            local result=0
            python3 tools/ios/capture_simulator_displays.py "$udid" "sim/${kind}" || result=1
            if [ "$result" -eq 0 ]; then
              python3 tools/ios/check_simulator_start.py "sim/${kind}-combined.log" sim/"${kind}"-display-*.png || result=1
            fi
            exit "$result"
          )
          failed=0
          start_one iPhone || failed=1
          start_one iPad || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'simulator'
        with:
          name: ios-simulator-first-start-${{ matrix.arch }}
          path: sim/
          if-no-files-found: warn

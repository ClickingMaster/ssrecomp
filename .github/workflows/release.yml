# Builds the setup executables (no game code in them) for Linux (x86_64 and arm64)
# Windows and macOS. Started by hand (Actions tab -> Setup executables -> Run workflow); the
# files are then under the run's artifacts. Add "release: types: [published]" to
# attach them to every published release automatically.
name: Setup executables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc, so the executable runs on more distributions
            file: dist/ssrecomp-setup
            asset: ssrecomp-setup-linux-x86_64
          - os: ubuntu-22.04-arm
            file: dist/ssrecomp-setup
            asset: ssrecomp-setup-linux-aarch64.AppImage
            appimage: aarch64
          - os: macos-15
            file: dist/ssrecomp-setup.app
            asset: ssrecomp-setup-macos-arm64.zip
            mac: true
          - os: macos-15-intel
            file: dist/ssrecomp-setup.app
            asset: ssrecomp-setup-macos-x86_64.zip
            mac: true
          - os: windows-latest
            file: dist/ssrecomp-setup.exe
            asset: ssrecomp-setup-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pyinstaller>=6" certifi pillow
      - run: python tools/package_setup.py
      - name: Audit and archive the Mac app
        if: matrix.mac
        run: |
          python tools/macos/audit_bundle.py "${{ matrix.file }}"
          codesign --verify --deep --strict "${{ matrix.file }}"
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.file }}" "${{ matrix.asset }}"
      - name: Make the AppImage
        if: matrix.appimage
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=./appimagetool tools/make_appimage.sh "${{ matrix.file }}" ${{ matrix.appimage }} "${{ matrix.asset }}"
      - name: Rename
        if: ${{ !matrix.appimage && !matrix.mac }}
        shell: bash
        run: mv "${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          sha256sum ssrecomp-setup-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: artifacts/SHA256SUMS.txt
      - name: Attach SHA256SUMS.txt to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt

# Builds the Mac download (Pokemon Fulldex.app, tools/mac/build_all.sh) for Apple silicon
# and Intel Macs. Started by the maintainer's publish script (or by hand: Actions tab > Mac
# download > Run workflow); the zips are then the run's artifacts.
#
# Its inputs come from a draft (unpublished) release, mac-build-inputs: SoulSilver and
# HeartGold's tables (addresses only, made from the maintainer's ROM by tables_only.py), the
# game list's pictures and the icon. No ROM, save or game code is ever given to this workflow.
name: Mac download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # (Apple silicon, built on an Intel Mac: GitHub's Apple silicon queue three times left this
          # job without a Mac for 15 minutes.)
          - os: macos-15-intel
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cmake>=3.21,<4" ninja
      - name: Check Mac game shortcuts
        run: python tests/mac_shortcuts.py
      - name: The inputs (tables of addresses, pictures, icon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inputs
          gh release download mac-build-inputs -R "${{ github.repository }}" -p mac-inputs.tar.gz -D inputs
          tar -xzf inputs/mac-inputs.tar.gz -C inputs
          ls inputs
      - name: GBA games (mGBA and the widescreen patches, when the inputs include them)
        run: bash tools/apple/fetch_gba.sh inputs
      - run: tools/mac/build_all.sh inputs/build-gen-tables inputs/box-art inputs/icon.jpg
        env:
          SSR_MAC_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            build-mac-dist/pokemon-ds-wide-pc-macos-${{ matrix.arch }}.zip
            build-mac-dist/SHA256SUMS.txt
          if-no-files-found: error
